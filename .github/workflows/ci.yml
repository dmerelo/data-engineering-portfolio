name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint flagship code
        run: |
          ruff check projects/aws-incremental-data-pipeline/src/incremental_pipeline.py \
            projects/aws-incremental-data-pipeline/src/orchestration.py \
            projects/aws-incremental-data-pipeline/dags \
            projects/aws-incremental-data-pipeline/tests

      - name: Check flagship formatting
        run: |
          ruff format --check projects/aws-incremental-data-pipeline/src/incremental_pipeline.py \
            projects/aws-incremental-data-pipeline/src/orchestration.py \
            projects/aws-incremental-data-pipeline/dags \
            projects/aws-incremental-data-pipeline/tests

      - name: Run tests
        run: pytest -q
